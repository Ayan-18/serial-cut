[project]
name = "serialcuts"
version = "0.1.0"
description = "Local Windows-first AI/video pipeline for finding and rendering vertical clips from owned series footage."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.10.1",
  "SQLAlchemy==2.0.52",
  "alembic==1.19.1",
  "python-dotenv==1.1.1",
  "faster-whisper==1.2.0",
  "ctranslate2==4.6.0",
  "scenedetect-headless==0.7.1",
  "httpx==0.28.1",
  "python-telegram-bot==22.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

