[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "serialcuts"
version = "0.1.0"
description = "Local Windows-first AI/video pipeline for finding and rendering vertical clips from owned series footage."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.10.1",
  "SQLAlchemy==2.0.52",
  "alembic==1.19.1",
  "python-dotenv==1.2.2",
  "requests==2.34.2",
  "numpy==2.4.6",
  "opencv-python-headless==5.0.0.93",
  "faster-whisper==1.2.0",
  "ctranslate2==4.6.3",
  "scenedetect-headless==0.7.1",
  "httpx==0.28.1",
  "python-telegram-bot==22.3",
]

[project.optional-dependencies]
dev = [
  "ruff==0.14.9",
  "mypy==1.19.0",
  "pytest==9.0.3",
  "pytest-cov==6.2.1",
]
# Local neural narration voice (Silero v4_ru). CPU-only is enough.
# Resolved to torch 2.14.0 (CPU, win_amd64) on the target machine 2026-09-03.
tts = [
  "torch==2.14.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E731 (lambda assignment) is a deliberate style in a few adapters. F401/F403/F405
# are back on now that the route modules use explicit imports.
ignore = ["E731"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["migrations/"]
# Remaining typing debt (~65 findings), tracked in WORKLOG. `list-item` mostly
# fires on Pydantic models accepting dict literals, which is a valid runtime pattern.
disable_error_code = [
  "arg-type",
  "assignment",
  "attr-defined",
  "list-item",
  "misc",
  "union-attr",
]

